name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Compile, credo & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # The replay parser NIF (native/replay_parser) is compiled by Rustler
      # during `mix compile`, so the Rust toolchain must be present.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix and Cargo
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
            ~/.cargo/git
            native/replay_parser/target
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('native/replay_parser/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  native:
    name: Rust NIF (fmt & clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/replay_parser
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/replay_parser/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/replay_parser/Cargo.lock') }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
