# Fly.io config for the broodwar.live JSON API.
# `broodwar-api` is a placeholder; `fly launch --no-deploy` may rename it.

app = "broodwar-api"
# Tokyo: closest Fly region to the Korean audience (Fly has no Seoul region).
primary_region = "nrt"
kill_signal = "SIGTERM"

[build]

[env]
  PHX_HOST = "api.broodwar.live"
  PORT = "4000"
  DATABASE_PATH = "/data/broodwar.db"
  CLIENT_IP_HEADER = "fly-client-ip"
  STATIC_SITE_URL = "https://broodwar.live"

# SQLite lives on a volume; create it first with:
#   fly volumes create broodwar_data --region nrt --size 1
[mounts]
  source = "broodwar_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  # SQLite + a single volume means exactly one machine. Keep it running so
  # Oban cron (stream polling) keeps firing.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
